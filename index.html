<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Avenelix — AI Engineering, Software & SaaS."><title>Avenelix — Coming Soon</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#010307;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}.scene{min-height:100svh;position:relative;display:grid;place-items:center;padding:32px 6vw;overflow:hidden}.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 76% 48%,rgba(65,145,255,.13),transparent 29%),linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:auto,64px 64px;mask-image:linear-gradient(to bottom,#000,transparent 92%)}.content{width:min(1050px,100%);position:relative;z-index:5}.eyebrow{display:inline-flex;gap:9px;align-items:center;padding:9px 13px;border:1px solid #292e35;border-radius:999px;background:#07090bcc;backdrop-filter:blur(15px);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#aeb5bf}.dot{width:6px;height:6px;border-radius:50%;background:#77b7ff;box-shadow:0 0 16px #77b7ff;animation:pulse 2s infinite}h1{font-size:clamp(4rem,11vw,9rem);line-height:.84;letter-spacing:-.075em;margin:24px 0 25px;font-weight:800}.tagline{color:#9ca5b0;font-size:clamp(1rem,2.3vw,1.3rem);line-height:1.55;max-width:590px}.tagline strong{color:#f3f5f7;font-weight:500}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.button{padding:13px 17px;border-radius:11px;text-decoration:none;font-size:14px;display:inline-flex;transition:.25s}.primary{background:#f4f6f8;color:#050607}.secondary{border:1px solid #303640;color:#d8dde3;background:#080a0dcc}.button:hover{transform:translateY(-3px);box-shadow:0 15px 35px #0008}.note{color:#555d67;font-size:12px;margin-top:15px}.globe-wrap{position:absolute;right:clamp(-100px,2vw,40px);top:50%;width:min(50vw,650px);aspect-ratio:1;transform:translateY(-50%);z-index:2;cursor:grab;touch-action:none;filter:drop-shadow(0 0 55px rgba(80,150,255,.14))}.globe-wrap:active{cursor:grabbing}#globe{position:absolute;inset:0}.hint{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);color:#65717d;font-size:10px;letter-spacing:.08em;white-space:nowrap;pointer-events:none}canvas{display:block;width:100%!important;height:100%!important}@keyframes pulse{50%{transform:scale(1.35);opacity:.65}}@media(max-width:760px){body{overflow:auto}.scene{min-height:100svh;align-items:start;padding:28px 18px}.content{text-align:center;margin-top:8vh}.eyebrow{justify-content:center}h1{font-size:clamp(4rem,20vw,6rem)}.tagline{margin:0 auto}.actions{justify-content:center}.button{width:min(100%,350px);justify-content:center}.globe-wrap{width:min(105vw,480px);right:50%;top:38%;transform:translate(50%,-50%);opacity:.48}.content{z-index:5}.hint{display:none}}@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style></head>
<body><main class="scene">
<div class="globe-wrap" id="globeWrap"><div id="globe"></div><div class="hint">DRAG TO ROTATE · SCROLL TO ZOOM</div></div>
<section class="content"><div class="eyebrow"><span class="dot"></span> Something is taking shape</div><h1>Avenelix</h1><p class="tagline"><strong>AI Engineering · Software · SaaS</strong><br>Building intelligent software and AI systems for businesses.</p><div class="actions"><a class="button primary" href="mailto:hello@avenelix.com">Start a conversation →</a><a class="button secondary" href="mailto:hello@avenelix.com">hello@avenelix.com</a></div><p class="note">Avenelix is preparing something new.</p></section>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js';
const wrap=document.querySelector('#globeWrap'),host=document.querySelector('#globe');
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,1,.1,100);camera.position.z=3.25;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(650,650,false);renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
const globe=new THREE.Group();scene.add(globe);
const loader=new THREE.TextureLoader();
const earthTexture=loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');earthTexture.colorSpace=THREE.SRGBColorSpace;
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,96,96),new THREE.MeshPhongMaterial({map:earthTexture,shininess:8,specular:new THREE.Color(0x334455)}));globe.add(earth);
const clouds=loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');
const cloudMesh=new THREE.Mesh(new THREE.SphereGeometry(1.008,64,64),new THREE.MeshPhongMaterial({map:clouds,transparent:true,opacity:.22,depthWrite:false}));globe.add(cloudMesh);
const atmosphere=new THREE.Mesh(new THREE.SphereGeometry(1.045,64,64),new THREE.MeshBasicMaterial({color:0x4da8ff,transparent:true,opacity:.075,side:THREE.BackSide,blending:THREE.AdditiveBlending}));globe.add(atmosphere);
scene.add(new THREE.AmbientLight(0x7899bb,1.35));const key=new THREE.DirectionalLight(0xffffff,2.8);key.position.set(-3,2,4);scene.add(key);const rim=new THREE.DirectionalLight(0x2f8cff,1.2);rim.position.set(4,-1,-3);scene.add(rim);
let dragging=false,lastX=0,lastY=0,vel=.0018,targetZoom=3.25;
wrap.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;wrap.setPointerCapture(e.pointerId)});wrap.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;globe.rotation.y+=dx*.006;globe.rotation.x=Math.max(-.55,Math.min(.55,globe.rotation.x+dy*.003));vel=dx*.0008});wrap.addEventListener('pointerup',()=>dragging=false);wrap.addEventListener('pointercancel',()=>dragging=false);wrap.addEventListener('wheel',e=>{e.preventDefault();targetZoom=Math.max(2.55,Math.min(4.2,targetZoom+e.deltaY*.0015))},{passive:false});
function resize(){const r=wrap.getBoundingClientRect();camera.aspect=r.width/r.height;camera.updateProjectionMatrix();renderer.setSize(r.width,r.height,false)}addEventListener('resize',resize);resize();
function animate(){requestAnimationFrame(animate);if(!dragging){globe.rotation.y+=vel;vel*=.985;if(Math.abs(vel)<.00035)vel=.0018}cloudMesh.rotation.y+=.00018;camera.position.z+=(targetZoom-camera.position.z)*.06;renderer.render(scene,camera)}animate();
</script></body></html>
