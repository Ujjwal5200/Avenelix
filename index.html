<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Avenelix — AI Engineering, Software & SaaS." />
  <title>Avenelix — Coming Soon</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; background: #050505; color: #f5f5f5; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
    .wrap { width: min(820px, 100%); text-align: center; }
    .brand { margin: 0; font-size: clamp(4rem, 13vw, 9rem); line-height: .9; letter-spacing: -.07em; font-weight: 800; }
    .accent { width: 72px; height: 2px; margin: 30px auto; background: #fff; opacity: .75; }
    .tagline { margin: 0; font-size: clamp(1.05rem, 2.6vw, 1.35rem); color: #b9b9b9; letter-spacing: .01em; }
    .status { display: inline-flex; align-items: center; gap: 9px; margin-top: 34px; padding: 9px 14px; border: 1px solid #292929; border-radius: 999px; color: #d7d7d7; font-size: .86rem; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; }
    .contact { display: inline-block; margin-top: 28px; padding: 12px 18px; border: 1px solid #3a3a3a; border-radius: 10px; color: #fff; text-decoration: none; transition: border-color .2s, transform .2s; }
    .contact:hover { border-color: #777; transform: translateY(-1px); }
    footer { margin-top: 70px; color: #666; font-size: .82rem; }
  </style>
</head>
<body>
  <main>
    <section class="wrap">
      <h1 class="brand">Avenelix</h1>
      <div class="accent"></div>
      <p class="tagline">AI Engineering · Software · SaaS</p>
      <div class="status"><span class="dot"></span> Coming soon</div>
      <div><a class="contact" href="mailto:hello@avenelix.com">hello@avenelix.com</a></div>
      <footer>Building intelligent software and AI systems for businesses.</footer>
    </section>
  </main>
</body>
</html>
