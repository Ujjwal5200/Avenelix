<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Avenelix — AI Engineering, Software & SaaS.">
<title>Avenelix — Coming Soon</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030307;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}.scene{min-height:100svh;position:relative;display:grid;place-items:center;padding:32px 6vw;overflow:hidden;background:radial-gradient(circle at 75% 45%,rgba(88,144,255,.09),transparent 30%),radial-gradient(circle at 25% 70%,rgba(171,92,255,.05),transparent 28%)}.scene:before{content:"";position:absolute;inset:0;opacity:.65;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:68px 68px;mask-image:radial-gradient(circle at 60% 50%,#000,transparent 78%)}.scene:after{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg at 70% 48%,transparent 0 14%,rgba(95,145,255,.055) 17%,transparent 21% 100%);filter:blur(40px);animation:halo 18s linear infinite;pointer-events:none}.content{width:min(1050px,100%);position:relative;z-index:10}.eyebrow{display:inline-flex;gap:9px;align-items:center;padding:9px 13px;border:1px solid #292d35;border-radius:999px;background:#07090bcc;backdrop-filter:blur(15px);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#b5bcc6;animation:reveal .8s ease both}.dot{width:6px;height:6px;border-radius:50%;background:#8dc2ff;box-shadow:0 0 15px #7eb7ff;animation:pulse 2.1s infinite}h1{font-size:clamp(4rem,11vw,9rem);line-height:.84;letter-spacing:-.075em;margin:24px 0 25px;font-weight:800;animation:reveal .95s .07s ease both}.tagline{color:#9ea7b2;font-size:clamp(1rem,2.3vw,1.3rem);line-height:1.55;max-width:600px;animation:reveal .95s .14s ease both}.tagline strong{color:#f3f5f7;font-weight:500}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;animation:reveal .95s .21s ease both}.button{padding:13px 17px;border-radius:11px;text-decoration:none;font-size:14px;display:inline-flex;min-height:46px;align-items:center;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease,background .25s ease}.primary{background:#f4f6f8;color:#050607;box-shadow:0 10px 28px rgba(0,0,0,.24)}.secondary{border:1px solid #303640;color:#d8dde3;background:#080a0dcc;backdrop-filter:blur(12px)}.button:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,0,0,.4)}.secondary:hover{border-color:#606975;background:#0c0f14e6}.note{color:#59616b;font-size:12px;margin-top:15px;animation:reveal .95s .28s ease both}.globe-wrap{position:absolute;right:-2%;top:50%;width:min(54vw,700px);aspect-ratio:1;transform:translateY(-50%);z-index:3;cursor:grab;touch-action:none;filter:drop-shadow(0 0 70px rgba(74,140,255,.12))}.globe-wrap:active{cursor:grabbing}.globe-wrap:focus{outline:none}.globe-vignette{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,transparent 55%,rgba(0,0,0,.18) 78%,rgba(0,0,0,.55) 100%);pointer-events:none;z-index:2}.globe-aura{position:absolute;inset:-4%;border-radius:50%;background:radial-gradient(circle,rgba(90,162,255,.12),transparent 66%);filter:blur(22px);animation:aura 5s ease-in-out infinite alternate;pointer-events:none}.hint{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);color:#65707c;font-size:10px;letter-spacing:.1em;white-space:nowrap;pointer-events:none;z-index:4}.spark{position:absolute;width:2px;height:2px;border-radius:50%;background:#9fd0ff;box-shadow:0 0 10px #9fd0ff;opacity:.55;animation:float 6s ease-in-out infinite}.s1{left:10%;top:22%;animation-delay:-1s}.s2{left:18%;top:75%;animation-delay:-3.4s}.s3{left:85%;top:22%;animation-delay:-5s}.s4{left:90%;top:74%;animation-delay:-2s}.s5{left:52%;top:10%;animation-delay:-4s}canvas{display:block;width:100%!important;height:100%!important}@keyframes pulse{50%{transform:scale(1.35);opacity:.65}}@keyframes reveal{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}@keyframes halo{to{transform:rotate(360deg)}}@keyframes aura{from{transform:scale(.96);opacity:.55}to{transform:scale(1.04);opacity:.9}}@keyframes float{0%,100%{transform:translate3d(0,0,0);opacity:.25}50%{transform:translate3d(8px,-12px,0);opacity:.85}}@media(max-width:760px){body{overflow:auto}.scene{min-height:100svh;align-items:start;padding:28px 18px}.content{text-align:center;margin-top:8vh}.eyebrow{justify-content:center}h1{font-size:clamp(4rem,20vw,6rem)}.tagline{margin:0 auto}.actions{justify-content:center}.button{width:min(100%,350px);justify-content:center}.globe-wrap{width:min(108vw,500px);right:50%;top:37%;transform:translate(50%,-50%);opacity:.5}.hint{display:none}}@media(prefers-reduced-motion:reduce){.dot,.scene:after,.globe-aura,.spark{animation:none}.eyebrow,h1,.tagline,.actions,.note{animation:none;opacity:1;filter:none;transform:none}}
</style>
</head>
<body>
<main class="scene">
<span class="spark s1" aria-hidden="true"></span><span class="spark s2" aria-hidden="true"></span><span class="spark s3" aria-hidden="true"></span><span class="spark s4" aria-hidden="true"></span><span class="spark s5" aria-hidden="true"></span>
<div class="globe-wrap" id="globeWrap" tabindex="0" aria-label="Interactive Avenelix visual. Drag to rotate."><div class="globe-aura"></div><div id="globe"></div><div class="globe-vignette"></div><div class="hint">DRAG TO EXPLORE · SCROLL TO ZOOM</div></div>
<section class="content"><div class="eyebrow"><span class="dot"></span> Something is taking shape</div><h1>Avenelix</h1><p class="tagline"><strong>AI Engineering · Software · SaaS</strong><br>Building intelligent software and AI systems for businesses.</p><div class="actions"><a class="button primary" href="mailto:hello@avenelix.com">Start a conversation →</a><a class="button secondary" href="mailto:hello@avenelix.com">hello@avenelix.com</a></div><p class="note">Avenelix is preparing something new.</p></section>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js';
const wrap=document.querySelector('#globeWrap'),host=document.querySelector('#globe');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32,1,.1,100);camera.position.set(0,0,3.15);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(600,600,false);renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
const globe=new THREE.Group();scene.add(globe);
const loader=new THREE.TextureLoader();
const base=loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',t=>t.colorSpace=THREE.SRGBColorSpace);
const landGlow=loader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg');
const cloudTex=loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,112,112),new THREE.MeshPhongMaterial({map:base,specularMap:landGlow,specular:new THREE.Color(0x516781),shininess:18,color:0x9aa6b4}));globe.add(earth);
const clouds=new THREE.Mesh(new THREE.SphereGeometry(1.012,96,96),new THREE.MeshPhongMaterial({map:cloudTex,transparent:true,opacity:.10,depthWrite:false,color:0xc7d9ed}));globe.add(clouds);
const shell=new THREE.Mesh(new THREE.SphereGeometry(1.045,96,96),new THREE.MeshBasicMaterial({color:0x69aaff,transparent:true,opacity:.055,side:THREE.BackSide,blending:THREE.AdditiveBlending}));globe.add(shell);
const wire=new THREE.Mesh(new THREE.SphereGeometry(1.055,40,40),new THREE.MeshBasicMaterial({color:0x4a9dff,transparent:true,opacity:.05,wireframe:true,blending:THREE.AdditiveBlending}));globe.add(wire);
const core=new THREE.Mesh(new THREE.SphereGeometry(.78,64,64),new THREE.MeshBasicMaterial({color:0x0a1320,transparent:true,opacity:.18,side:THREE.BackSide}));globe.add(core);
scene.add(new THREE.AmbientLight(0x6e86a6,.72));
const key=new THREE.DirectionalLight(0xcfe3ff,3.3);key.position.set(-3,2,4);scene.add(key);
const rim=new THREE.DirectionalLight(0x4b96ff,1.65);rim.position.set(4,-1,-3);scene.add(rim);
const fill=new THREE.PointLight(0x76b7ff,10,5);fill.position.set(1.6,.2,2.5);scene.add(fill);
let dragging=false,lastX=0,lastY=0,velocity=.0019,targetZoom=3.15;
wrap.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;wrap.setPointerCapture(e.pointerId)});
wrap.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;globe.rotation.y+=dx*.006;globe.rotation.x=Math.max(-.55,Math.min(.55,globe.rotation.x+dy*.003));velocity=dx*.0009});
wrap.addEventListener('pointerup',()=>dragging=false);wrap.addEventListener('pointercancel',()=>dragging=false);
wrap.addEventListener('wheel',e=>{e.preventDefault();targetZoom=Math.max(2.55,Math.min(4.1,targetZoom+e.deltaY*.0013))},{passive:false});
wrap.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')globe.rotation.y-=.08;if(e.key==='ArrowRight')globe.rotation.y+=.08;if(e.key==='ArrowUp')globe.rotation.x=Math.min(.55,globe.rotation.x+.05);if(e.key==='ArrowDown')globe.rotation.x=Math.max(-.55,globe.rotation.x-.05);if(e.key==='+'||e.key==='=')targetZoom=Math.max(2.55,targetZoom-.15);if(e.key==='-'||e.key==='_')targetZoom=Math.min(4.1,targetZoom+.15)});
function resize(){const r=wrap.getBoundingClientRect();camera.aspect=Math.max(.5,r.width/Math.max(r.height,1));camera.updateProjectionMatrix();renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false)}addEventListener('resize',resize);resize();
function animate(){requestAnimationFrame(animate);if(!dragging){globe.rotation.y+=velocity;velocity*=.987;if(Math.abs(velocity)<.00035)velocity=.0019}clouds.rotation.y+=.00012;shell.rotation.y-=.00003;wire.rotation.y+=.00005;camera.position.z+=(targetZoom-camera.position.z)*.055;renderer.render(scene,camera)}animate();
</script>
</body></html>
