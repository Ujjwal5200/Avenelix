<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Avenelix — AI Engineering, Software & SaaS."><title>Avenelix — Coming Soon</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020406;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 75% 48%,rgba(80,150,255,.11),transparent 28%),radial-gradient(circle at 20% 80%,rgba(255,255,255,.04),transparent 28%),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:auto,auto,64px 64px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}
.scene{min-height:100svh;position:relative;display:grid;place-items:center;padding:32px 6vw}.content{width:min(1050px,100%);position:relative;z-index:5}.eyebrow{display:inline-flex;gap:9px;align-items:center;padding:9px 13px;border:1px solid #292e35;border-radius:999px;background:#07090bcc;backdrop-filter:blur(15px);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#aeb5bf}.dot{width:6px;height:6px;border-radius:50%;background:#77b7ff;box-shadow:0 0 16px #77b7ff;animation:pulse 2s infinite}h1{font-size:clamp(4rem,11vw,9rem);line-height:.84;letter-spacing:-.075em;margin:24px 0 25px;font-weight:800}.tagline{color:#9ca5b0;font-size:clamp(1rem,2.3vw,1.3rem);line-height:1.55;max-width:590px}.tagline strong{color:#f3f5f7;font-weight:500}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.button{padding:13px 17px;border-radius:11px;text-decoration:none;font-size:14px;transition:.25s;display:inline-flex}.primary{background:#f4f6f8;color:#050607}.secondary{border:1px solid #303640;color:#d8dde3;background:#080a0dcc}.button:hover{transform:translateY(-3px);box-shadow:0 15px 35px #0008}.note{color:#555d67;font-size:12px;margin-top:15px}
.globe-wrap{position:absolute;right:clamp(-100px,2vw,40px);top:50%;width:min(48vw,600px);aspect-ratio:1;transform:translateY(-50%);z-index:2;filter:drop-shadow(0 0 55px rgba(80,150,255,.13));cursor:grab;touch-action:none}.globe-wrap:active{cursor:grabbing}.globe{position:absolute;inset:5%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 34% 27%,#8cc9ff 0 1%,#174f82 18%,#06233c 48%,#01070d 74%);box-shadow:inset -45px -25px 70px #000, inset 18px 12px 35px #9bd5ff44,0 0 70px #247fc522}.map{position:absolute;inset:-8%;border-radius:50%;background-image:url('https://cdn.jsdelivr.net/gh/datasets/geo-countries@main/data/countries.geojson');opacity:0}
/* Procedural-looking land masses. They move with the globe layers to create a physical 3D feel. */
.land{position:absolute;inset:-12%;width:124%;height:124%;border-radius:50%;background:radial-gradient(ellipse 15% 24% at 24% 38%,#4d8d58 0 48%,transparent 51%),radial-gradient(ellipse 13% 29% at 34% 63%,#3d754a 0 46%,transparent 49%),radial-gradient(ellipse 17% 11% at 51% 30%,#477f4e 0 48%,transparent 51%),radial-gradient(ellipse 13% 18% at 60% 54%,#568c55 0 44%,transparent 48%),radial-gradient(ellipse 18% 10% at 76% 39%,#3e7548 0 45%,transparent 49%),radial-gradient(ellipse 11% 18% at 80% 70%,#507f4d 0 43%,transparent 48%);filter:saturate(.7);transform:translateX(0);transition:transform .05s linear}.land:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(165deg,transparent 0 16px,#b9d8a21c 17px 18px,transparent 19px 32px);mix-blend-mode:screen}.atmo{position:absolute;inset:2%;border-radius:50%;box-shadow:inset 10px 0 18px #8bd2ff55,inset -18px -8px 28px #000,0 0 18px #6ebcff55;pointer-events:none}.longitude,.latitude{position:absolute;inset:3%;border:1px solid #a8d9ff26;border-radius:50%;pointer-events:none}.longitude{transform:rotateY(65deg)}.longitude.two{transform:rotateY(115deg)}.latitude{transform:rotateX(68deg)}.latitude.two{transform:rotateX(48deg)}.shine{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 28% 23%,#fff5 0 2%,transparent 18%),linear-gradient(105deg,transparent 42%,#0009 72%);pointer-events:none}.orbit{position:absolute;inset:-3%;border:1px solid #8ccaff30;border-radius:50%;transform:rotateX(70deg) rotateZ(-22deg);animation:orbit 18s linear infinite}.orbit:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#a9dcff;box-shadow:0 0 15px #72bdff;left:15%;top:8%}.hint{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);color:#687582;font-size:11px;letter-spacing:.08em;white-space:nowrap;opacity:.8}
@keyframes orbit{to{transform:rotateX(70deg) rotateZ(338deg)}}@keyframes pulse{50%{transform:scale(1.35);opacity:.65}}@media(max-width:760px){body{overflow:auto}.scene{min-height:100svh;align-items:start;padding:28px 18px}.content{text-align:center;margin-top:8vh}.eyebrow{justify-content:center}h1{font-size:clamp(4rem,20vw,6rem)}.tagline{margin:0 auto}.actions{justify-content:center}.button{width:min(100%,350px);justify-content:center}.globe-wrap{width:min(100vw,440px);right:50%;top:38%;transform:translate(50%,-50%);opacity:.42;z-index:1}.content{z-index:5}.note{margin-top:12px}.hint{display:none}}
@media(prefers-reduced-motion:reduce){.orbit{animation:none}}
</style></head>
<body>
<main class="scene">
<div class="globe-wrap" id="globe" aria-label="Interactive rotating globe" role="img">
 <div class="globe"><div class="land" id="land"></div><div class="longitude"></div><div class="longitude two"></div><div class="latitude"></div><div class="latitude two"></div><div class="atmo"></div><div class="shine"></div></div>
 <div class="orbit"></div><div class="hint">DRAG TO ROTATE · SCROLL TO ZOOM</div>
</div>
<section class="content"><div class="eyebrow"><span class="dot"></span> Something is taking shape</div><h1>Avenelix</h1><p class="tagline"><strong>AI Engineering · Software · SaaS</strong><br>Building intelligent software and AI systems for businesses.</p><div class="actions"><a class="button primary" href="mailto:hello@avenelix.com">Start a conversation →</a><a class="button secondary" href="mailto:hello@avenelix.com">hello@avenelix.com</a></div><p class="note">Avenelix is preparing something new.</p></section>
</main>
<script>
const wrap=document.getElementById('globe'),land=document.getElementById('land');let dragging=false,lastX=0,rotation=0,velocity=.16,zoom=1;
function render(){land.style.transform=`translateX(${rotation}px) scale(${zoom})`}
wrap.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;velocity=0;wrap.setPointerCapture(e.pointerId)});
wrap.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX;lastX=e.clientX;rotation+=dx*.72;velocity=dx*.72;render()});
wrap.addEventListener('pointerup',()=>dragging=false);wrap.addEventListener('pointercancel',()=>dragging=false);
wrap.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.92,Math.min(1.22,zoom-e.deltaY*.0007));render()},{passive:false});
function auto(){if(!dragging){rotation+=velocity;velocity*=.985;if(Math.abs(velocity)<.08)velocity=.16;render()}requestAnimationFrame(auto)}auto();
</script></body></html>
