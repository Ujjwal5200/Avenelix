<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Avenelix — AI Engineering, Software & SaaS." />
  <title>Avenelix — Coming Soon</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      overflow-x: hidden;
      background: #020202;
      color: #f7f7f7;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at 55% 45%, black, transparent 76%);
    }
    body::after {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      background: radial-gradient(circle at 68% 38%, rgba(255,255,255,.065), transparent 24%), radial-gradient(circle at 22% 72%, rgba(255,255,255,.028), transparent 30%);
      animation: ambient 11s ease-in-out infinite alternate;
    }
    .scene { min-height: 100svh; display: grid; place-items: center; position: relative; isolation: isolate; perspective: 1200px; padding: clamp(24px, 5vw, 64px); }
    .orb-wrap { position: absolute; width: min(60vw, 620px); height: min(60vw, 620px); min-width: 300px; min-height: 300px; right: -3%; top: 50%; transform: translateY(-50%) rotateX(10deg) rotateY(-18deg); pointer-events: none; z-index: -1; }
    .orb { position: absolute; inset: 11%; border-radius: 50%; background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.98) 0 1.1%, transparent 1.7%), radial-gradient(circle at 38% 33%, rgba(255,255,255,.18), transparent 19%), radial-gradient(circle at 50% 48%, #242424 0 23%, #0b0b0b 61%, #020202 100%); box-shadow: inset -70px -45px 100px rgba(0,0,0,.96), inset 25px 25px 60px rgba(255,255,255,.08), 0 0 120px rgba(255,255,255,.08); animation: float 7s ease-in-out infinite; }
    .orb::before, .orb::after { content: ""; position: absolute; inset: -4%; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); transform: rotate(22deg) scaleY(.32); box-shadow: 0 0 24px rgba(255,255,255,.05); }
    .orb::after { transform: rotate(-28deg) scaleY(.56); border-color: rgba(255,255,255,.08); }
    .ring { position: absolute; inset: 3%; border: 1px solid rgba(255,255,255,.1); border-radius: 50%; transform: rotateX(66deg) rotateZ(-22deg); animation: spin 15s linear infinite; }
    .ring.r2 { inset: 14%; transform: rotateY(72deg) rotateZ(30deg); animation-duration: 12s; animation-direction: reverse; }
    .ring.r3 { inset: -6%; transform: rotateX(76deg) rotateZ(48deg) scale(.88); opacity: .55; animation-duration: 20s; }
    .particle-field { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .particle { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.5); box-shadow: 0 0 9px rgba(255,255,255,.35); animation: drift linear infinite; }
    .p1{left:8%;top:24%;animation-duration:12s}.p2{left:16%;top:67%;animation-duration:17s;animation-delay:-6s}.p3{left:31%;top:12%;animation-duration:15s;animation-delay:-8s}.p4{left:77%;top:18%;animation-duration:13s;animation-delay:-2s}.p5{left:86%;top:72%;animation-duration:18s;animation-delay:-9s}.p6{left:71%;top:88%;animation-duration:14s;animation-delay:-5s}.p7{left:49%;top:82%;animation-duration:16s;animation-delay:-11s}.p8{left:91%;top:43%;animation-duration:20s;animation-delay:-3s}
    .content { width: min(940px, 100%); text-align: left; padding: 24px 0; position: relative; z-index: 2; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; border: 1px solid #272727; background: rgba(5,5,5,.58); backdrop-filter: blur(16px); border-radius: 999px; padding: 9px 13px; color: #bdbdbd; font-size: clamp(.68rem, 1.7vw, .78rem); letter-spacing: .09em; text-transform: uppercase; animation: reveal .8s ease both; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 13px rgba(255,255,255,.9); flex: 0 0 auto; animation: pulse 2.2s ease-in-out infinite; }
    h1 { margin: clamp(20px, 4vw, 28px) 0 0; font-size: clamp(3.5rem, 13vw, 9rem); line-height: .84; letter-spacing: -.075em; font-weight: 800; animation: reveal .9s .08s ease both; }
    .tagline { margin: clamp(24px, 4vw, 30px) 0 0; max-width: 580px; font-size: clamp(1rem, 2.7vw, 1.35rem); line-height: 1.55; color: #a8a8a8; animation: reveal .9s .16s ease both; }
    .tagline strong { color: #f2f2f2; font-weight: 500; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; animation: reveal .9s .24s ease both; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 13px 17px; border-radius: 11px; text-decoration: none; font-size: .9rem; min-height: 46px; transition: transform .25s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease; }
    .button.primary { color: #050505; background: #f5f5f5; border: 1px solid #f5f5f5; box-shadow: 0 10px 30px rgba(0,0,0,.22); }
    .button.primary:hover { transform: translateY(-3px) scale(1.015); box-shadow: 0 18px 40px rgba(0,0,0,.4); }
    .button.secondary { color: #ddd; border: 1px solid #303030; background: rgba(10,10,10,.5); backdrop-filter: blur(12px); }
    .button.secondary:hover { transform: translateY(-3px); border-color: #6b6b6b; background: rgba(25,25,25,.62); }
    .email-note { margin-top: 16px; color: #5d5d5d; font-size: .74rem; animation: reveal .9s .32s ease both; }
    footer { margin-top: 70px; color: #505050; font-size: .78rem; letter-spacing: .12em; animation: reveal 1s .4s ease both; }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-16px) rotate(2.5deg); } }
    @keyframes spin { from { transform: rotateX(66deg) rotateZ(-22deg); } to { transform: rotateX(66deg) rotateZ(338deg); } }
    @keyframes ambient { from { transform: scale(1) translate3d(0,0,0); } to { transform: scale(1.08) translate3d(-2%,1%,0); } }
    @keyframes pulse { 0%,100%{opacity:.65;transform:scale(1)}50%{opacity:1;transform:scale(1.25)} }
    @keyframes drift { 0% { transform: translate3d(0,0,0); opacity: 0; } 20% { opacity: .7; } 75% { opacity: .7; } 100% { transform: translate3d(18px,-34px,0); opacity: 0; } }
    @keyframes reveal { from { opacity: 0; transform: translateY(18px); filter: blur(6px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
    @media (max-width: 700px) {
      .scene { min-height: 100svh; padding: 24px 18px; }
      .content { text-align: center; padding: 16px 0 24px; }
      .tagline { margin-left: auto; margin-right: auto; }
      .actions { justify-content: center; }
      .button { width: min(100%, 360px); }
      .orb-wrap { width: min(100vw, 460px); height: min(100vw, 460px); right: 50%; top: 33%; transform: translate(50%,-50%); opacity: .34; }
      footer { margin-top: 52px; }
      .email-note { max-width: 310px; margin-left: auto; margin-right: auto; }
    }
    @media (max-width: 420px) {
      .eyebrow { max-width: 100%; justify-content: center; }
      h1 { font-size: clamp(3.2rem, 21vw, 5.8rem); }
      .tagline { font-size: 1rem; }
      .actions { margin-top: 26px; }
      .p3,.p5,.p6 { display:none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .orb, .ring, .particle, .dot, body::after { animation: none !important; }
      .eyebrow, h1, .tagline, .actions, .email-note, footer { animation: none !important; opacity: 1; transform: none; filter: none; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="particle-field" aria-hidden="true">
      <span class="particle p1"></span><span class="particle p2"></span><span class="particle p3"></span><span class="particle p4"></span>
      <span class="particle p5"></span><span class="particle p6"></span><span class="particle p7"></span><span class="particle p8"></span>
    </div>
    <div class="orb-wrap" aria-hidden="true">
      <div class="orb"></div>
      <div class="ring"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
    </div>
    <section class="content">
      <div class="eyebrow"><span class="dot"></span> Something is taking shape</div>
      <h1>Avenelix</h1>
      <p class="tagline"><strong>AI Engineering · Software · SaaS</strong><br />Building intelligent software and AI systems for businesses.</p>
      <div class="actions">
        <a class="button primary" href="mailto:hello@avenelix.com">Start a conversation →</a>
        <a class="button secondary" href="mailto:hello@avenelix.com">hello@avenelix.com</a>
      </div>
      <p class="email-note">Avenelix is preparing something new.</p>
      <footer>AVENELIX — COMING SOON</footer>
    </section>
  </main>
</body>
</html>
